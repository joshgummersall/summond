name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go test ./...

      - name: fmt
        run: |
          gofmt_out=$(gofmt -l .)
          if [ -n "$gofmt_out" ]; then
            echo "Files not formatted:"
            echo "$gofmt_out"
            exit 1
          fi

      - name: build arm64
        run: GOOS=darwin GOARCH=arm64 go build -ldflags "-X github.com/joshgummersall/summond/internal/cli.version=${GITHUB_REF_NAME}" -o summond-darwin-arm64 ./cmd/summond

      - name: build amd64
        run: GOOS=darwin GOARCH=amd64 go build -ldflags "-X github.com/joshgummersall/summond/internal/cli.version=${GITHUB_REF_NAME}" -o summond-darwin-amd64 ./cmd/summond

      - name: release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            summond-darwin-arm64
            summond-darwin-amd64
