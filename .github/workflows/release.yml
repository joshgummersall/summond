name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    # macOS runner: the xpcevent package needs cgo, which cross-compiling
    # from Linux silently disables (the no-op stub would ship instead).
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: go test ./...

      - name: fmt
        run: |
          gofmt_out=$(gofmt -l .)
          if [ -n "$gofmt_out" ]; then
            echo "Files not formatted:"
            echo "$gofmt_out"
            exit 1
          fi

      - name: configure ssh
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.TAP_DEPLOY_KEY }}" > ~/.ssh/homebrew-tap
          chmod 600 ~/.ssh/homebrew-tap
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - uses: goreleaser/goreleaser-action@v7
        with:
          # Pin the GoReleaser CLI's major explicitly. v7 of the action
          # happens to default to this, but the pin is the thing we
          # actually want to depend on, not the default.
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_DEPLOY_KEY_PATH: /Users/runner/.ssh/homebrew-tap
