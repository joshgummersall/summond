version: 2

builds:
  - main: ./cmd/summond
    env:
      - CGO_ENABLED=1
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/joshgummersall/summond/internal/cli.version={{.Version}}

archives:
  - formats: [binary]
    name_template: "summond-{{.Os}}-{{.Arch}}"

checksum:
  name_template: checksums.txt

homebrew_casks:
  - repository:
      owner: joshgummersall
      name: homebrew-summond
      git:
        url: ssh://git@github.com/joshgummersall/homebrew-summond.git
        private_key: "{{ .Env.HOMEBREW_TAP_DEPLOY_KEY_PATH }}"
    directory: Casks
    homepage: https://github.com/joshgummersall/summond
    description: Schedule and manage macOS background jobs without writing a single plist
    binaries:
      - summond
    hooks:
      post:
        install_steps: |
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}"]
          if_path_exists "Library/Application Support/summond", base: :home do
            run "{{ "{{" }}HOMEBREW_PREFIX{{ "}}" }}/bin/summond",
                args:           ["refresh-runtime"],
                must_succeed:   false,
                writable_paths: ["Library/Application Support/summond"],
                writable_base:  :home
          end
          if_path_exists "/Library/Application Support/summond" do
            run "{{ "{{" }}HOMEBREW_PREFIX{{ "}}" }}/bin/summond",
                args:         ["refresh-runtime"],
                sudo:         true,
                must_succeed: false
          end
    # Jobs run from a copy of summond in each scope's state directory. After
    # install or upgrade, refresh-runtime replaces that copy so jobs run the
    # new version. Each step runs only if its scope has state, so machines
    # without daemon jobs never see a sudo prompt. A failed refresh (for
    # example, sudo with no terminal) does not fail the upgrade; the next
    # apply in that scope refreshes the copy. Unprivileged steps run in a
    # sandbox with a temporary HOME, so home paths use base: :home rather
    # than "~". summond finds the home directory from the user database, not
    # $HOME. Sudo steps run outside the sandbox.
    caveats: |
      Jobs keep running after `brew uninstall`. To remove every job, log, and
      state directory, run `summond uninstall` (agents) and
      `sudo summond uninstall` (daemons) first, or use `brew uninstall --zap`.
    # Homebrew runs uninstall stanzas and *_steps hooks on `brew upgrade` too,
    # so job cleanup belongs in zap, which runs only on `brew uninstall --zap`.
    # `summond uninstall` boots out every managed job, including idle ones that
    # the launchctl wildcard misses (it matches running jobs only). Each run
    # cleans one scope, so it runs twice: as the user for agents, then with
    # sudo for daemons. The newsyslog glob removes config that summond v1
    # installed; v2 does not use newsyslog. zap lives in custom_block because
    # GoReleaser's zap key has no script field.
    custom_block: |
      zap early_script: {
            executable:   "#{HOMEBREW_PREFIX}/bin/summond",
            args:         ["uninstall", "--yes"],
            must_succeed: false,
          },
          launchctl:    "com.joshgummersall.summond.*",
          script:       {
            executable:   "#{HOMEBREW_PREFIX}/bin/summond",
            args:         ["uninstall", "--yes"],
            sudo:         true,
            must_succeed: false,
          },
          delete:       [
            "/Library/LaunchDaemons/com.joshgummersall.summond.*.plist",
            "/Library/Application Support/summond",
            "/etc/newsyslog.d/com.joshgummersall.summond*.conf",
          ],
          trash:        [
            "~/Library/LaunchAgents/com.joshgummersall.summond.*.plist",
            "~/Library/Application Support/summond",
          ]
