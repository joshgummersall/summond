[jobs.brew-maintenance]
shell_command = """
brew update
brew upgrade
brew cleanup
"""
target = "agent"
schedule = "weekly"
enabled = true

[jobs.chezmoi-update]
command = "chezmoi"
args = ["update"]
target = "agent"
schedule = "daily"
enabled = true

[jobs.podman-machine-start]
shell_command = """
if [ -z "$(podman machine list --format '{{.Name}}' 2>/dev/null)" ]; then
  exit 0
fi

state=$(podman machine inspect --format '{{.State}}' 2>/dev/null || echo "unknown")
if [ "$state" != "running" ]; then
  echo "$(date '+%Y-%m-%d %H:%M:%S') state='$state', starting..."
  if podman machine start; then
    echo "$(date '+%Y-%m-%d %H:%M:%S') started"
  else
    rc=$?
    echo "$(date '+%Y-%m-%d %H:%M:%S') start failed (exit $rc)" >&2
    exit "$rc"
  fi
fi
"""
target = "agent"
schedule = "login"
enabled = true
