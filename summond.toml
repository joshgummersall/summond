[jobs.brew]
shell_command = "brew update && brew upgrade && brew cleanup"
target = "agent"
schedule = "weekly"

[jobs.chezmoi]
command = "chezmoi"
args = ["update"]
target = "agent"
schedule = "daily"

[jobs.podman]
shell_command = """
state=$(podman machine inspect --format '{{.State}}' 2>/dev/null || echo "unknown")
if [ "$state" != "running" ]; then
  if ! podman machine start; then
    rc=$?
    exit "$rc"
  fi
fi
"""
target = "agent"
schedule = "login"
