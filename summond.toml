[windows]
morning = { start_hour = 6, end_hour = 10 }

[jobs.agent-weekly-morning]
schedule = "weekly"
weekday = 1
window = "morning"
shell_command = "echo $SUMMOND_JOB_NAME && env"

[jobs.agent-login]
schedule = "login"
shell_command = "echo $SUMMOND_JOB_NAME && env"

[jobs.agent-hourly]
schedule = "hourly"
minute = 15
shell_command = "echo $SUMMOND_JOB_NAME && env"

[jobs.agent-daily]
schedule = "daily"
hour = 2
minute = 30
shell_command = "echo $SUMMOND_JOB_NAME && env"

[jobs.agent-weekly]
schedule = "weekly"
weekday = 1
hour = 3
minute = 0
shell_command = "echo $SUMMOND_JOB_NAME && env"

[jobs.agent-interval]
schedule = "interval"
interval_minutes = 5
shell_command = "echo $SUMMOND_JOB_NAME && env"

[jobs.agent-calendar]
schedule = "calendar"
day = 1
hour = 9
minute = 0
shell_command = "echo $SUMMOND_JOB_NAME && env"

[jobs.agent-on-change]
trigger = "on_change"
shell_command = """
echo $SUMMOND_JOB_NAME && env
if [ -n "$SUMMOND_CHANGED_PATHS" ]; then
  for path in ${SUMMOND_CHANGED_PATHS//:/ }; do
    stat "$path"
  done
fi
"""

[jobs.agent-on-change.watch]
paths = ["/tmp/summond"]

[jobs.agent-usb-attach]
trigger = "on_usb_attach"
shell_command = "echo $SUMMOND_JOB_NAME && env"

[jobs.agent-usb-attach.usb]
vendor_id  = "0x046d"  # Logitech
product_id = "0x085e"  # Brio

[jobs.agent-retry]
schedule = "login"
shell_command = """
echo $SUMMOND_JOB_NAME
echo "attempt $SUMMOND_ATTEMPT"
if [ "$SUMMOND_ATTEMPT" -lt 2 ]; then
  echo "failing on attempt $SUMMOND_ATTEMPT"
  exit 1
fi
echo "succeeded on attempt $SUMMOND_ATTEMPT"
"""

[jobs.agent-retry.retry]
attempts = 2
